plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

group = 'com.norm'
version = '1.0.0'
base { archivesName = 'Mine-a-Mob-Forge-1.20.1' }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            mods { mineamob { source sourceSets.main } }
        }
        client {}
        server { args '--nogui' }
    }
}

repositories {}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.28'
}

jar {
    manifest {
        attributes([
            'Specification-Title': 'mineamob',
            'Specification-Vendor': 'norm',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.jar.archiveVersion,
            'Implementation-Vendor': 'norm'
        ])
    }
}

jar.finalizedBy('reobfJar')
