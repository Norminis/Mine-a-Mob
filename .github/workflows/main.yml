
name: Build Mine-a-Mob Forge 1.20.1

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'

      - name: Build mod
        shell: bash
        run: |
          set -euo pipefail
          BUILD_FILE="$(find . -name build.gradle \
            -not -path '*/.gradle/*' -print -quit)"

          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: Could not find build.gradle"
            exit 1
          fi

          cd "$(dirname "$BUILD_FILE")"
          gradle build --no-daemon

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: Mine-a-Mob-Forge-1.20.1
          path: '**/build/libs/*-1.0.0.jar'
          if-no-files-found: error
